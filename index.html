<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaVibe • Connect, Share & Inspire</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Desktop Sidebar -->
        <aside class="sidebar" id="main-sidebar"></aside>

        <!-- Mobile Topbar -->
        <header class="mobile-topbar" id="mobile-topbar" style="display: none;"></header>

        <!-- Main Feed Content Area -->
        <main class="main-content">
            <div class="feed-container">
                <!-- Stories Carousel -->
                <section class="stories-wrapper" id="stories-container" aria-label="Stories">
                    <!-- Injected dynamically by feed.js -->
                </section>

                <!-- Hidden file input for adding story media -->
                <input type="file" id="story-upload-input" accept="image/*,video/*" style="display: none;" />

                <!-- Posts Stream -->
                <section id="feed-posts-container" aria-label="Feed Posts" style="display: flex; flex-direction: column; gap: 20px;">
                    <!-- Posts will load dynamically -->
                </section>
            </div>
        </main>

        <!-- Mobile Bottom Navigation -->
        <nav class="bottom-nav" id="bottom-navigation"></nav>
    </div>

    <!-- Create Post Modal Dialog -->
    <div class="modal-overlay" id="create-post-modal" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Create New Post</span>
                <button class="modal-close-btn" id="close-create-modal">&times;</button>
            </div>
            <form id="create-post-form">
                <div class="modal-body">
                    <!-- File drop zone / preview -->
                    <div id="media-drop-zone" style="border: 2px dashed var(--border-color); border-radius: var(--radius-md); padding: 32px 20px; text-align: center; cursor: pointer; background: var(--bg-surface-secondary); transition: all 0.2s;">
                        <input type="file" id="post-file-input" accept="image/*,video/mp4" style="display: none;" required />
                        <div id="drop-placeholder">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" style="margin-bottom: 12px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                            <h4 style="font-size: 15px; font-weight: 600; margin-bottom: 6px;">Select photos or videos to share</h4>
                            <p style="font-size: 12.5px; color: var(--text-secondary);">Supports JPG, PNG, WEBP, and MP4 up to 25MB</p>
                            <button type="button" class="btn btn-primary" style="margin-top: 14px; pointer-events: none;">Browse Files</button>
                        </div>
                        <div id="media-preview-container" style="display: none; max-height: 320px; overflow: hidden; border-radius: var(--radius-sm);">
                            <img id="image-preview" style="max-height: 320px; width: 100%; object-fit: contain; display: none;" />
                            <video id="video-preview" controls style="max-height: 320px; width: 100%; display: none;"></video>
                        </div>
                    </div>

                    <!-- Progress bar -->
                    <div id="upload-progress-container" style="display: none; height: 5px; width: 100%; background: var(--border-light); border-radius: 4px; overflow: hidden;">
                        <div id="upload-progress-fill" style="height: 100%; width: 0%; background: var(--brand-gradient); transition: width 0.2s;"></div>
                    </div>

                    <!-- Caption & Tags -->
                    <div>
                        <label style="font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block;">Caption & Hashtags</label>
                        <textarea id="post-caption-input" rows="3" placeholder="Write an inspiring caption... Add #hashtags to connect with vibes!" style="width: 100%; resize: none;"></textarea>
                    </div>

                    <!-- Alt text for accessibility -->
                    <div>
                        <label style="font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; display: block;">Alt Text (Accessibility description)</label>
                        <input type="text" id="post-alt-input" placeholder="Briefly describe what's in the media" style="width: 100%;" />
                    </div>

                    <button type="submit" id="submit-post-btn" class="btn btn-gradient" style="width: 100%; padding: 12px; font-size: 15px;">Share Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts bootstrap -->
    <script type="module">
        import { renderNavigation, initAuthObserver, showToast } from "./js/app.js";
        import { renderStories, renderFeed } from "./js/feed.js";
        import { createPost } from "./js/posts.js";
        import { toggleNotificationsDropdown } from "./js/notifications.js";

        // Render main responsive navigation
        renderNavigation("home");

        // Auth state observation
        initAuthObserver((profile) => {
            renderStories();
            renderFeed();
        });

        // Notifications trigger
        document.getElementById("nav-notifications")?.addEventListener("click", (e) => {
            e.preventDefault();
            toggleNotificationsDropdown();
        });
        document.getElementById("mobile-notif-btn")?.addEventListener("click", () => {
            toggleNotificationsDropdown();
        });

        // Create Post Modal handlers
        const createModal = document.getElementById("create-post-modal");
        const dropZone = document.getElementById("media-drop-zone");
        const fileInput = document.getElementById("post-file-input");
        const dropPlaceholder = document.getElementById("drop-placeholder");
        const previewContainer = document.getElementById("media-preview-container");
        const imgPreview = document.getElementById("image-preview");
        const videoPreview = document.getElementById("video-preview");
        const closeCreateBtn = document.getElementById("close-create-modal");
        const createForm = document.getElementById("create-post-form");
        const submitBtn = document.getElementById("submit-post-btn");

        dropZone.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (!file) return;

            dropPlaceholder.style.display = "none";
            previewContainer.style.display = "block";

            const fileUrl = URL.createObjectURL(file);
            if (file.type.startsWith("video")) {
                imgPreview.style.display = "none";
                videoPreview.style.display = "block";
                videoPreview.src = fileUrl;
            } else {
                videoPreview.style.display = "none";
                imgPreview.style.display = "block";
                imgPreview.src = fileUrl;
            }
        });

        closeCreateBtn.addEventListener("click", () => {
            createModal.classList.remove("active");
            createForm.reset();
            dropPlaceholder.style.display = "block";
            previewContainer.style.display = "none";
        });

        createForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            const caption = document.getElementById("post-caption-input").value;
            const altText = document.getElementById("post-alt-input").value;

            if (!file) {
                showToast("Please choose a photo or video to upload", "error");
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "Publishing...";
                document.getElementById("upload-progress-container").style.display = "block";

                await createPost({
                    mediaFile: file,
                    caption,
                    altText
                });

                closeCreateBtn.click();
                renderFeed();
            } catch (err) {
                showToast(err.message || "Failed to create post", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Share Post";
                document.getElementById("upload-progress-container").style.display = "none";
            }
        });
    </script>
</body>
</html>
