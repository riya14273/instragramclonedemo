<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile • InstaVibe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="main-sidebar"></aside>

        <!-- Mobile Topbar -->
        <header class="mobile-topbar" id="mobile-topbar" style="display: none;"></header>

        <!-- Main Content -->
        <main class="main-content">
            <div style="max-width: 935px; width: 100%; display: flex; flex-direction: column; gap: 32px;">
                <!-- Profile Header Information -->
                <div class="profile-header-container" style="display: flex; gap: 48px; align-items: center; padding: 20px 24px;">
                    <div style="position: relative;">
                        <img id="profile-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80" class="profile-avatar-large" style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 3px solid var(--border-light);" />
                    </div>

                    <div style="flex: 1; display: flex; flex-direction: column; gap: 16px;">
                        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                            <h2 id="profile-username" style="font-size: 20px; font-weight: 600;">username</h2>
                            <div id="profile-action-container">
                                <button id="edit-profile-btn" class="btn btn-secondary">Edit Profile</button>
                            </div>
                        </div>

                        <div class="profile-stats" style="display: flex; gap: 32px; font-size: 15px;">
                            <span><strong id="stat-posts">0</strong> posts</span>
                            <span><strong id="stat-followers">0</strong> followers</span>
                            <span><strong id="stat-following">0</strong> following</span>
                        </div>

                        <div>
                            <h3 id="profile-fullname" style="font-size: 15px; font-weight: 700;">Full Name</h3>
                            <p id="profile-bio" style="font-size: 14px; color: var(--text-secondary); margin-top: 4px; white-space: pre-line;">Bio description...</p>
                            <a id="profile-website" href="#" target="_blank" style="font-size: 13.5px; color: var(--primary); font-weight: 600; display: block; margin-top: 4px;"></a>
                        </div>
                    </div>
                </div>

                <!-- Tabs: Posts & Saved -->
                <div style="border-top: 1px solid var(--border-color); display: flex; justify-content: center; gap: 48px;">
                    <button class="profile-tab active" id="tab-posts" style="display: flex; align-items: center; gap: 6px; padding: 14px 0; font-size: 13px; font-weight: 700; border-top: 1px solid var(--text-primary); margin-top: -1px; text-transform: uppercase; letter-spacing: 1px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        Posts
                    </button>
                    <button class="profile-tab" id="tab-saved" style="display: flex; align-items: center; gap: 6px; padding: 14px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                        Saved
                    </button>
                </div>

                <!-- Grid of Posts -->
                <div class="profile-posts-grid" id="profile-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
                    <!-- Posts or saved items will be rendered here -->
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" id="bottom-navigation"></nav>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="edit-profile-modal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Edit Profile</span>
                <button class="modal-close-btn" id="close-edit-modal">&times;</button>
            </div>
            <form id="edit-profile-form">
                <div class="modal-body">
                    <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 8px;">
                        <img id="edit-avatar-preview" src="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;" />
                        <div>
                            <input type="file" id="edit-avatar-input" accept="image/*" style="display: none;" />
                            <button type="button" class="btn btn-secondary" onclick="document.getElementById('edit-avatar-input').click();">Change Profile Photo</button>
                        </div>
                    </div>
                    <div>
                        <label style="font-size: 13px; font-weight: 600; margin-bottom: 4px; display: block;">Name</label>
                        <input type="text" id="edit-name" style="width: 100%;" />
                    </div>
                    <div>
                        <label style="font-size: 13px; font-weight: 600; margin-bottom: 4px; display: block;">Bio</label>
                        <textarea id="edit-bio" rows="3" style="width: 100%; resize: none;"></textarea>
                    </div>
                    <div>
                        <label style="font-size: 13px; font-weight: 600; margin-bottom: 4px; display: block;">Website</label>
                        <input type="url" id="edit-website" placeholder="https://yourportfolio.com" style="width: 100%;" />
                    </div>
                    <button type="submit" id="save-profile-btn" class="btn btn-primary" style="width: 100%; padding: 10px;">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Post Detail Lightbox Modal -->
    <div class="modal-overlay" id="post-detail-modal">
        <div class="modal-card" style="max-width: 800px; height: 600px; display: flex; flex-direction: row; padding: 0;">
            <div style="flex: 1.2; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                <img id="modal-post-img" style="max-width: 100%; max-height: 100%; object-fit: contain;" />
            </div>
            <div style="flex: 0.9; display: flex; flex-direction: column; background: var(--bg-surface); border-left: 1px solid var(--border-color);">
                <div style="padding: 14px 16px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <img id="modal-post-avatar" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;" />
                        <span id="modal-post-user" style="font-weight: 700; font-size: 14px;"></span>
                    </div>
                    <button class="modal-close-btn" id="close-post-detail">&times;</button>
                </div>
                <div style="flex: 1; padding: 16px; overflow-y: auto; font-size: 14px;">
                    <p id="modal-post-caption" style="line-height: 1.5;"></p>
                </div>
                <div style="padding: 14px 16px; border-top: 1px solid var(--border-light); font-size: 14px; font-weight: 700;">
                    <span id="modal-post-likes">0 likes</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { renderNavigation, initAuthObserver, showToast, AppState } from "./js/app.js";
        import { fetchUserProfile, fetchUserPosts, toggleFollowUser, isCurrentlyFollowing, updateCurrentUserProfile } from "./js/profile.js";
        import { getStoredPosts } from "./js/posts.js";

        renderNavigation("profile");

        // Parse query params to see if viewing another user
        const urlParams = new URLSearchParams(window.location.search);
        const targetUsername = urlParams.get("user");

        initAuthObserver(async (currentUser) => {
            const profile = await fetchUserProfile(targetUsername || currentUser?.username);
            if (!profile) {
                showToast("User not found", "error");
                return;
            }

            renderProfileHeader(profile, currentUser);
            loadUserPosts(profile);
        });

        function renderProfileHeader(profile, currentUser) {
            document.getElementById("profile-username").textContent = profile.username;
            document.getElementById("profile-fullname").textContent = profile.fullName || profile.username;
            document.getElementById("profile-bio").textContent = profile.bio || "";
            document.getElementById("profile-avatar").src = profile.photoURL || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80";
            
            const websiteEl = document.getElementById("profile-website");
            if (profile.website) {
                websiteEl.textContent = profile.website;
                websiteEl.href = profile.website;
                websiteEl.style.display = "block";
            } else {
                websiteEl.style.display = "none";
            }

            document.getElementById("stat-posts").textContent = profile.postsCount || 0;
            document.getElementById("stat-followers").textContent = profile.followersCount || 0;
            document.getElementById("stat-following").textContent = profile.followingCount || 0;

            const actionContainer = document.getElementById("profile-action-container");
            const isSelf = currentUser && (currentUser.uid === profile.uid || currentUser.username === profile.username);

            if (isSelf) {
                actionContainer.innerHTML = `<button id="edit-profile-btn" class="btn btn-secondary">Edit Profile</button>`;
                document.getElementById("edit-profile-btn").addEventListener("click", () => openEditModal(profile));
            } else {
                const following = isCurrentlyFollowing(profile.uid, profile.username);
                actionContainer.innerHTML = `
                    <button id="follow-toggle-btn" class="btn ${following ? 'btn-secondary' : 'btn-primary'}">
                        ${following ? 'Following' : 'Follow'}
                    </button>
                `;
                const followBtn = document.getElementById("follow-toggle-btn");
                followBtn.addEventListener("click", async () => {
                    const result = await toggleFollowUser(profile.uid, profile.username);
                    if (result !== null) {
                        followBtn.textContent = result ? "Following" : "Follow";
                        followBtn.className = `btn ${result ? 'btn-secondary' : 'btn-primary'}`;
                        const stat = document.getElementById("stat-followers");
                        stat.textContent = parseInt(stat.textContent || "0", 10) + (result ? 1 : -1);
                    }
                });
            }
        }

        async function loadUserPosts(profile) {
            const grid = document.getElementById("profile-grid");
            const posts = await fetchUserPosts(profile.uid, profile.username);

            document.getElementById("stat-posts").textContent = posts.length;

            if (posts.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--text-muted);">
                        <h3>No Posts Shared Yet</h3>
                    </div>
                `;
                return;
            }

            grid.innerHTML = posts.map(p => `
                <div class="grid-post-item" data-post-id="${p.id}" style="position: relative; aspect-ratio: 1/1; cursor: pointer; overflow: hidden; border-radius: var(--radius-sm); background: #000;">
                    <img src="${p.mediaUrl}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s;" />
                    <div class="grid-overlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; gap: 20px; color: #fff; opacity: 0; transition: opacity 0.2s;">
                        <span>❤️ ${p.likesCount || 0}</span>
                        <span>💬 ${p.commentsCount || (p.comments ? p.comments.length : 0)}</span>
                    </div>
                </div>
            `).join('');

            // Hover and Click to open detail lightbox
            grid.querySelectorAll(".grid-post-item").forEach(item => {
                const overlay = item.querySelector(".grid-overlay");
                item.addEventListener("mouseenter", () => overlay.style.opacity = "1");
                item.addEventListener("mouseleave", () => overlay.style.opacity = "0");
                item.addEventListener("click", () => {
                    const postId = item.getAttribute("data-post-id");
                    const found = posts.find(p => p.id === postId);
                    if (found) openPostDetail(found);
                });
            });
        }

        // Post Lightbox Detail
        function openPostDetail(post) {
            const modal = document.getElementById("post-detail-modal");
            document.getElementById("modal-post-img").src = post.mediaUrl;
            document.getElementById("modal-post-avatar").src = post.userAvatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80";
            document.getElementById("modal-post-user").textContent = post.username;
            document.getElementById("modal-post-caption").textContent = post.caption;
            document.getElementById("modal-post-likes").textContent = `${post.likesCount || 0} likes`;

            modal.classList.add("active");
            document.getElementById("close-post-detail").onclick = () => modal.classList.remove("active");
        }

        // Edit Profile modal handlers
        const editModal = document.getElementById("edit-profile-modal");
        function openEditModal(profile) {
            document.getElementById("edit-name").value = profile.fullName || "";
            document.getElementById("edit-bio").value = profile.bio || "";
            document.getElementById("edit-website").value = profile.website || "";
            document.getElementById("edit-avatar-preview").src = profile.photoURL || "";
            editModal.classList.add("active");
        }

        document.getElementById("close-edit-modal").addEventListener("click", () => editModal.classList.remove("active"));

        let selectedAvatarFile = null;
        document.getElementById("edit-avatar-input").addEventListener("change", (e) => {
            selectedAvatarFile = e.target.files[0];
            if (selectedAvatarFile) {
                document.getElementById("edit-avatar-preview").src = URL.createObjectURL(selectedAvatarFile);
            }
        });

        document.getElementById("edit-profile-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("save-profile-btn");
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                const updated = await updateCurrentUserProfile({
                    fullName: document.getElementById("edit-name").value,
                    bio: document.getElementById("edit-bio").value,
                    website: document.getElementById("edit-website").value,
                    avatarFile: selectedAvatarFile
                });

                editModal.classList.remove("active");
                renderProfileHeader(updated, updated);
            } catch (err) {
                showToast(err.message || "Could not update profile", "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Save Changes";
            }
        });

        // Tabs click
        document.getElementById("tab-saved").addEventListener("click", () => {
            showToast("Saved bookmarks collection", "info");
        });
    </script>
</body>
</html>
