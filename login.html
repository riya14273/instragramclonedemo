<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • InstaVibe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-main);">
    <div style="width: 100%; max-width: 380px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
        <!-- Auth Card -->
        <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 40px 32px; box-shadow: var(--shadow-sm); text-align: center;">
            <div style="margin-bottom: 28px;">
                <a href="index.html" class="brand-logo" style="font-size: 32px; justify-content: center;">
                    <span class="brand-icon-gradient" style="padding: 6px; border-radius: 12px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path></svg>
                    </span>
                    <span>InstaVibe</span>
                </a>
                <p style="font-size: 13.5px; color: var(--text-secondary); margin-top: 10px;">Sign in to see photos and videos from your friends.</p>
            </div>

            <form id="login-form" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="login-identifier" placeholder="Username, phone, or email" required autocomplete="username" />
                <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
                
                <button type="submit" id="login-submit-btn" class="btn btn-gradient" style="width: 100%; padding: 11px; margin-top: 6px;">Log In</button>
            </form>

            <div style="display: flex; align-items: center; margin: 20px 0; gap: 12px;">
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
                <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">OR</span>
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
            </div>

            <button type="button" id="forgot-password-btn" style="color: var(--primary); font-size: 13px; font-weight: 600;">Forgot password?</button>
        </div>

        <!-- Switch Card -->
        <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; text-align: center; font-size: 14px;">
            Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 700;">Sign up</a>
        </div>
    </div>

    <script type="module">
        import { handleLogin, handlePasswordReset } from "./js/auth.js";
        import { initTheme, showToast } from "./js/app.js";

        initTheme();

        const loginForm = document.getElementById("login-form");
        const submitBtn = document.getElementById("login-submit-btn");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const identifier = document.getElementById("login-identifier").value;
            const password = document.getElementById("login-password").value;

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "Logging in...";
                await handleLogin(identifier, password);
                setTimeout(() => window.location.href = "index.html", 500);
            } catch (err) {
                showToast(err.message || "Failed to log in", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Log In";
            }
        });

        document.getElementById("forgot-password-btn").addEventListener("click", async () => {
            const email = prompt("Enter your account email to receive a password reset link:");
            if (email) {
                try {
                    await handlePasswordReset(email);
                } catch (e) {
                    showToast(e.message, "error");
                }
            }
        });
    </script>
</body>
</html>
