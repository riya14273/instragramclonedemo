<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up • InstaVibe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-main); padding: 24px 0;">
    <div style="width: 100%; max-width: 380px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
        <!-- Auth Card -->
        <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 36px 32px; box-shadow: var(--shadow-sm); text-align: center;">
            <div style="margin-bottom: 24px;">
                <a href="index.html" class="brand-logo" style="font-size: 32px; justify-content: center;">
                    <span class="brand-icon-gradient" style="padding: 6px; border-radius: 12px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path></svg>
                    </span>
                    <span>InstaVibe</span>
                </a>
                <p style="font-size: 13.5px; color: var(--text-secondary); margin-top: 10px; font-weight: 500;">Sign up to see photos and videos from your friends.</p>
            </div>

            <form id="signup-form" style="display: flex; flex-direction: column; gap: 10px; text-align: left;">
                <div>
                    <input type="email" id="signup-email" placeholder="Email" required style="width: 100%;" />
                </div>
                <div>
                    <input type="text" id="signup-name" placeholder="Full Name" required style="width: 100%;" />
                </div>
                <div>
                    <input type="text" id="signup-username" placeholder="Username" required style="width: 100%;" />
                    <span id="username-feedback" style="font-size: 11.5px; display: block; margin-top: 3px;"></span>
                </div>
                <div>
                    <input type="password" id="signup-password" placeholder="Password (at least 6 characters)" required minlength="6" style="width: 100%;" />
                </div>

                <p style="font-size: 11.5px; color: var(--text-muted); text-align: center; margin: 8px 0; line-height: 1.4;">
                    People who use our service may have uploaded your contact information to InstaVibe. By signing up, you agree to our Terms and Privacy Policy.
                </p>
                
                <button type="submit" id="signup-submit-btn" class="btn btn-gradient" style="width: 100%; padding: 11px;">Sign Up</button>
            </form>
        </div>

        <!-- Switch Card -->
        <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; text-align: center; font-size: 14px;">
            Have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Log in</a>
        </div>
    </div>

    <script type="module">
        import { handleSignUp, isUsernameTaken } from "./js/auth.js";
        import { initTheme, showToast } from "./js/app.js";

        initTheme();

        const signupForm = document.getElementById("signup-form");
        const usernameInput = document.getElementById("signup-username");
        const usernameFeedback = document.getElementById("username-feedback");
        const submitBtn = document.getElementById("signup-submit-btn");

        let debounceTimer;
        usernameInput.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            const val = usernameInput.value.trim();
            if (val.length < 3) {
                usernameFeedback.textContent = "";
                return;
            }
            debounceTimer = setTimeout(async () => {
                const taken = await isUsernameTaken(val);
                if (taken) {
                    usernameFeedback.style.color = "var(--danger)";
                    usernameFeedback.textContent = "✕ Username already taken";
                } else {
                    usernameFeedback.style.color = "var(--success)";
                    usernameFeedback.textContent = "✓ Username available";
                }
            }, 350);
        });

        signupForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("signup-email").value;
            const name = document.getElementById("signup-name").value;
            const username = usernameInput.value;
            const password = document.getElementById("signup-password").value;

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "Creating account...";
                await handleSignUp({ name, username, email, password });
                setTimeout(() => window.location.href = "index.html", 500);
            } catch (err) {
                showToast(err.message || "Failed to create account", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign Up";
            }
        });
    </script>
</body>
</html>
